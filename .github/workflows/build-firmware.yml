name: Build ImmortalWrt firmware for OneThing Edge Cube (OEC) - RK3566

# 云编译：产出可刷写的 OEC 整机固件（rockchip/armv8）。
# 目标设备由 Device/onething_oec 定义，设备树取自 mainline v7.1。
#
# 触发：Actions -> 本 workflow -> Run workflow
#
# 产物：immortalwrt-rockchip-armv8-onething_oec-squashfs-sysupgrade.img.gz
#       （整盘镜像，含 U-Boot + GPT，BOOT_FLOW = pine64-img）

on:
  workflow_dispatch:
    inputs:
      imm_ref:
        description: 'ImmortalWrt source ref (branch/tag/commit)'
        required: false
        default: 'master'
      include_luci:
        description: 'Include LuCI web UI'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      extra_packages:
        description: 'Extra packages (space separated)'
        required: false
        default: 'luci-app-openclash'
  push:
    branches: [main]
    paths:
      - 'files/**'
      - 'apply-to-immortalwrt.sh'
      - 'packages/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # GitHub-hosted runners hard-cap a single job at 360 min.
    timeout-minutes: 355

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # swig + python3-pyelftools are not optional here:
          # package/boot/uboot-rockchip/Makefile sets
          #   UBOOT_USE_BINMAN:=1      -> include/u-boot.mk wants python3-pyelftools
          #   UBOOT_USE_INTREE_DTC:=1  -> include/u-boot.mk wants python3-dev,
          #                               python3-setuptools and swig
          # Missing them aborts the build at "Checking 'python3-pyelftools'".
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget qemu-utils ccache libelf-dev swig \
            python3 python3-dev python3-setuptools python3-pyelftools

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-rockchip-armv8-oec-${{ github.sha }}
          restore-keys: ccache-rockchip-armv8-oec-

      - name: Clone ImmortalWrt
        run: |
          REF="${{ github.event.inputs.imm_ref || 'master' }}"
          echo "Cloning ImmortalWrt @ $REF"
          git clone --depth 1 --branch "$REF" \
            https://github.com/immortalwrt/immortalwrt.git imm
          cd imm
          echo "IMM_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          git log -1 --format='%H %ad %s' --date=iso

      - name: Update & install feeds
        working-directory: imm
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------------------------------------------------------------- OEC 设备
      - name: Apply OEC (OneThing Edge Cube) device support
        run: |
          bash apply-to-immortalwrt.sh "$GITHUB_WORKSPACE/imm"
          echo "=== verification ==="
          ls -l imm/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3566-onething-edge-cube.dts
          sed -n '/^define Device\/onething_oec/,/^TARGET_DEVICES += onething_oec/p' \
            imm/target/linux/rockchip/image/armv8.mk

      # --------------------------------------------------- 本地 LuCI 应用
      - name: Install OEC bypass-router LuCI app
        run: |
          # 「网络 -> 旁路由设置」这个本地 LuCI 应用必须放进 imm/package/，
          # 而且要在 `make defconfig` 之前就位，tmp/.config-package.in 才会收录它。
          # 它同时安装 /etc/uci-defaults/99-oec-net，负责首启把 LAN 设成 DHCP 客户端
          # 并关掉本机 DHCP 服务（旁路由的硬性要求）。
          rm -rf imm/package/luci-app-oec-bypass
          cp -r "$GITHUB_WORKSPACE/packages/luci-app-oec-bypass" imm/package/
          echo "=== installed files ==="
          find imm/package/luci-app-oec-bypass -type f | sort

      - name: Apply build config
        working-directory: imm
        run: |
          LUCI="${{ github.event.inputs.include_luci || 'true' }}"
          EXTRA="${{ github.event.inputs.extra_packages || '' }}"

          # ---------------------------------------------------------------
          # How the U-Boot blob gets selected:
          #
          #   Device/onething_oec  ->  UBOOT_DEVICE_NAME := nanopi-r3s-rk3566
          #   Build/pine64-img     ->  dd if=$(STAGING_DIR_IMAGE)/\
          #                               $(UBOOT_DEVICE_NAME)-u-boot-rockchip.bin
          #
          # The blob comes from package `u-boot-nanopi-r3s-rk3566`, which is
          # HIDDEN (U-Boot/Default sets HIDDEN:=1 -> rendered by
          # scripts/package-metadata.pl as a prompt-less `bool`) and therefore
          # CANNOT be forced on from .config.  apply-to-immortalwrt.sh registers
          # onething_oec in that board's BUILD_DEVICES instead, so the
          # `default y if (..._DEVICE_onething_oec)` rule fires.
          #
          # The CONFIG_PACKAGE_... line below is harmless belt-and-braces; it is
          # expected to be dropped by kconfig, which is exactly why the
          # verification step inspects the metadata rather than .config.
          # ---------------------------------------------------------------
          gen_config() {
            echo "CONFIG_TARGET_rockchip=y"
            echo "CONFIG_TARGET_rockchip_armv8=y"
            echo "CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y"
            echo "CONFIG_PACKAGE_u-boot-nanopi-r3s-rk3566=y"
            echo "CONFIG_PACKAGE_trusted-firmware-a-rk3566=y"
            echo "CONFIG_CCACHE=y"

            if [ "$LUCI" = "true" ]; then
              echo "CONFIG_PACKAGE_luci=y"
              echo "CONFIG_PACKAGE_luci-ssl=y"
              echo "CONFIG_PACKAGE_luci-theme-bootstrap=y"
              echo "CONFIG_PACKAGE_luci-app-firewall=y"
              # 单网口旁路由设置页（自动获取 / 固定 IP）
              echo "CONFIG_PACKAGE_luci-app-oec-bypass=y"
            fi

            for p in $EXTRA; do
              echo "CONFIG_PACKAGE_$p=y"
            done
          }

          gen_config >> .config
          make defconfig

          # ---------------------------------------------------------------
          # Fail fast.  Two different kinds of check, because the two symbols
          # live in different worlds:
          #
          #   * the device symbol has a prompt  -> it shows up in .config
          #   * u-boot packages are HIDDEN      -> prompt-less `bool`, so they
          #     NEVER show up as CONFIG_PACKAGE_...=y; they are pulled in by
          #     `default y if DEFAULT_PACKAGE_...`.  Inspect the metadata.
          # ---------------------------------------------------------------
          missing=0

          if grep -q '^CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y' .config; then
            echo "OK   device onething_oec selected"
          else
            echo "MISS device onething_oec"; missing=1
          fi

          # 本地包：它是有 prompt 的普通包，应该能直接出现在 .config 里。
          # 若 MISS，多半是没放进 imm/package/ 或放晚了（defconfig 之后）。
          if grep -q '^CONFIG_PACKAGE_luci-app-oec-bypass=y' .config; then
            echo "OK   luci-app-oec-bypass selected"
          else
            echo "MISS luci-app-oec-bypass"
            { grep -n 'luci-app-oec-bypass' tmp/.config-package.in || echo '(absent from package metadata)'; }
            missing=1
          fi

          # NOTE: tmp/.config-package.in is TAB-indented, so the pattern must
          # tolerate leading whitespace -- an anchored /^config .../ never
          # matches and silently reports <absent>.
          UBBLK=$(sed -n '/^[[:space:]]*config PACKAGE_u-boot-nanopi-r3s-rk3566$/,/^[[:space:]]*$/p' tmp/.config-package.in)
          echo "--- PACKAGE_u-boot-nanopi-r3s-rk3566 ---"
          echo "${UBBLK:-<absent>}"

          if [ -z "$UBBLK" ]; then
            echo "MISS u-boot-nanopi-r3s-rk3566 not present in package metadata"; missing=1
          elif ! printf '%s\n' "$UBBLK" | grep -q 'onething_oec'; then
            echo "MISS u-boot default rule does not cover onething_oec"; missing=1
          else
            echo "OK   u-boot-nanopi-r3s-rk3566 present and defaulted for onething_oec"
          fi

          echo "=== resulting target config ==="
          grep -E '^CONFIG_TARGET_(rockchip|BOARD|SUBTARGET|ARCH_PACKAGES)' .config || true
          grep -E '^CONFIG_TARGET_rockchip_armv8_DEVICE_' .config || true
          grep -E '^CONFIG_PACKAGE_trusted-firmware-a' .config || true

          if [ "$missing" = "1" ]; then
            echo "--- rockchip u-boot packages in metadata ---"
            { grep -n 'config PACKAGE_u-boot-.*rk35' tmp/.config-package.in || true ; }
            echo "--- every metadata line mentioning onething_oec ---"
            { grep -n 'onething_oec' tmp/.config-package.in || true ; }
            echo "--- devices listed for rockchip/armv8 ---"
            { ./scripts/dump-target-info.pl devices rockchip/armv8 2>/dev/null \
                | head -40 ; } || true
            echo "FATAL: required config/metadata checks failed"
            exit 1
          fi

          echo "=== device profile sanity ==="
          { ./scripts/dump-target-info.pl devices rockchip/armv8 2>/dev/null \
              | grep -i onething ; } || echo "(dump-target-info did not list it; continuing)"

      - name: Verify build prerequisites
        working-directory: imm
        run: |
          # These are exactly the host checks include/u-boot.mk performs.
          # Fail here, with a readable message, instead of deep inside make.
          for t in python3 swig gcc g++ make patch; do
            command -v "$t" >/dev/null || { echo "MISSING host tool: $t"; exit 1; }
          done
          python3 -c 'import elftools; print("python3-pyelftools   OK")'
          python3 -c 'import setuptools; print("python3-setuptools   OK")'
          swig -version | head -3

      - name: Download sources
        working-directory: imm
        run: make -j"$(nproc)" download

      - name: Build firmware
        working-directory: imm
        run: |
          # GitHub's default shell already runs bash with -e -o pipefail,
          # so a failure inside `make` propagates through `tee`.
          make -j"$(nproc)" V=s 2>&1 | tee build.log
          echo "=== build finished ==="
          ls -lh bin/targets/rockchip/armv8/ | head -40

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp imm/bin/targets/rockchip/armv8/*onething_oec* out/ 2>/dev/null || true
          cp imm/bin/targets/rockchip/armv8/sha256sums out/ 2>/dev/null || true
          cp imm/bin/targets/rockchip/armv8/profiles.json out/ 2>/dev/null || true
          cp imm/build.log out/build.log 2>/dev/null || true
          echo "=== artifacts ==="
          ls -lh out/
          if ! ls out/*onething_oec* >/dev/null 2>&1; then
            echo "FATAL: no onething_oec image produced"; exit 1
          fi

      - name: Show build log tail on failure
        if: failure()
        run: |
          echo "=== last 200 lines of build log ==="
          tail -200 imm/build.log 2>/dev/null || true
          echo "=== last 200 lines of any openwrt log ==="
          tail -200 imm/logs/*.txt 2>/dev/null || true
          echo "=== .config head ==="
          head -60 imm/.config 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-oec-firmware
          path: out/*
          if-no-files-found: error
          retention-days: 30
