name: Build ImmortalWrt firmware for OneThing Edge Cube (OEC) - RK3566

# 云编译：产出可刷写的 OEC 整机固件（rockchip/armv8）。
# 目标设备由 Device/onething_oec 定义，设备树取自 mainline v7.1。
#
# 触发：Actions -> 本 workflow -> Run workflow
#
# 产物：immortalwrt-rockchip-armv8-onething_oec-squashfs-sysupgrade.img.gz
#       （整盘镜像，含 U-Boot + GPT，BOOT_FLOW = pine64-img）

on:
  workflow_dispatch:
    inputs:
      imm_ref:
        description: 'ImmortalWrt source ref (branch/tag/commit)'
        required: false
        default: 'master'
      include_luci:
        description: 'Include LuCI web UI'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      extra_packages:
        description: 'Extra packages (space separated)'
        required: false
        default: 'luci-app-openclash'
  push:
    branches: [main]
    paths:
      - 'files/**'
      - 'apply-to-immortalwrt.sh'
      - '.github/workflows/build-firmware.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget qemu-utils ccache libelf-dev python3 python3-setuptools

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-rockchip-armv8-oec-${{ github.sha }}
          restore-keys: ccache-rockchip-armv8-oec-

      - name: Clone ImmortalWrt
        run: |
          REF="${{ github.event.inputs.imm_ref || 'master' }}"
          echo "Cloning ImmortalWrt @ $REF"
          git clone --depth 1 --branch "$REF" \
            https://github.com/immortalwrt/immortalwrt.git imm
          cd imm
          echo "IMM_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          git log -1 --format='%H %ad %s' --date=iso

      - name: Update & install feeds
        working-directory: imm
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------------------------------------------------------------- OEC 设备
      - name: Apply OEC (OneThing Edge Cube) device support
        run: |
          bash apply-to-immortalwrt.sh "$GITHUB_WORKSPACE/imm"
          echo "=== verification ==="
          ls -l imm/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3566-onething-edge-cube.dts
          sed -n '/^define Device\/onething_oec/,/^TARGET_DEVICES += onething_oec/p' \
            imm/target/linux/rockchip/image/armv8.mk

      - name: Apply build config
        working-directory: imm
        run: |
          LUCI="${{ github.event.inputs.include_luci || 'true' }}"
          EXTRA="${{ github.event.inputs.extra_packages || '' }}"

          # start from the target's own defaults, then narrow to one device
          echo "CONFIG_TARGET_rockchip=y"                              >> .config
          echo "CONFIG_TARGET_rockchip_armv8=y"                        >> .config
          echo "CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y"    >> .config

          if [ "$LUCI" = "true" ]; then
            echo "CONFIG_PACKAGE_luci=y"                               >> .config
            echo "CONFIG_PACKAGE_luci-ssl=y"                           >> .config
            echo "CONFIG_PACKAGE_luci-theme-bootstrap=y"               >> .config
            echo "CONFIG_PACKAGE_luci-app-firewall=y"                  >> .config
          fi

          for p in $EXTRA; do
            echo "CONFIG_PACKAGE_$p=y" >> .config
          done

          make defconfig

          echo "=== resulting target config ==="
          grep -E '^CONFIG_TARGET_(rockchip|BOARD|SUBTARGET|ARCH_PACKAGES)' .config || true
          grep -E '^CONFIG_TARGET_rockchip_armv8_DEVICE_' .config || true
          echo "=== device profile sanity ==="
          ./scripts/dump-target-info.pl devices rockchip/armv8 2>/dev/null | grep -i onething || \
            echo "(dump-target-info did not list it; continuing)"

      - name: Download sources
        working-directory: imm
        run: make -j"$(nproc)" download

      - name: Build firmware
        working-directory: imm
        run: make -j"$(nproc)" V=s

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp imm/bin/targets/rockchip/armv8/*onething_oec* out/ 2>/dev/null || true
          cp imm/bin/targets/rockchip/armv8/sha256sums out/ 2>/dev/null || true
          cp imm/bin/targets/rockchip/armv8/profiles.json out/ 2>/dev/null || true
          echo "=== artifacts ==="
          ls -lh out/
          if ! ls out/*onething_oec* >/dev/null 2>&1; then
            echo "FATAL: no onething_oec image produced"; exit 1
          fi

      - name: Show build log tail on failure
        if: failure()
        run: |
          echo "=== last 200 lines of build log ==="
          tail -200 imm/logs/*.txt 2>/dev/null || true
          tail -200 imm/.config 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-oec-firmware
          path: out/*
          if-no-files-found: error
          retention-days: 30
